<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>我的記帳本</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1f1d1a;--sub:#7a746b;--line:#e8e3da;
  --out:#d9534f;--in:#2e9d6a;--acc:#1f1d1a;--chip:#efebe3;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171614;--card:#22201d;--ink:#f1ede6;--sub:#9d968b;--line:#34312c;--out:#ff7b72;--in:#4cc38a;--acc:#f1ede6;--chip:#2d2a26}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.month{display:flex;align-items:center;gap:6px}
.month button{border:0;background:var(--chip);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.month span{min-width:92px;text-align:center;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.bal .lbl{color:var(--sub);font-size:13px}
.bal .big{font-size:30px;font-weight:700;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 div{background:var(--chip);border-radius:12px;padding:10px 12px}
.row2 b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}
h2{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.cat{display:grid;grid-template-columns:72px 1fr 82px;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--out);border-radius:6px}
.cat .amt{text-align:right;font-variant-numeric:tabular-nums}
.day{font-size:12px;color:var(--sub);margin:14px 4px 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:18px;flex:none}
.item .t{flex:1;min-width:0}
.item .t div:first-child{font-weight:600}
.item .t div:last-child{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:600;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sub);padding:26px 0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));border:0;background:var(--acc);color:var(--bg);font-size:16px;font-weight:600;padding:14px 30px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}
.mask.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;color:var(--sub);padding:9px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amtin{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);margin-bottom:14px;padding-bottom:6px}
.amtin span{font-size:20px;color:var(--sub);font-weight:600}
.amtin input{border:0;outline:0;background:none;color:var(--ink);font-size:34px;font-weight:700;width:100%;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 11px;border-radius:20px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:12px}
label.f input{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.btns{display:flex;gap:10px;margin-top:6px}
.btns button{flex:1;border:0;padding:13px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.save{background:var(--acc);color:var(--bg)}
.cancel{background:var(--chip);color:var(--ink)}
.del{background:none;color:var(--out);flex:0 0 auto!important;padding:13px 10px!important}
.status{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
.tools .xl{width:100%;border:0;background:var(--in);color:#fff;padding:13px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.xlmsg{font-size:13px;text-align:center;margin-top:8px;min-height:0}
.xlmsg:empty{display:none}
.tools .sm{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:13px}
.tools .sm button,.tools .sm label{border:0;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px}
.photo{margin-bottom:14px}
.photo .add{display:block;text-align:center;border:1.5px dashed var(--line);border-radius:12px;padding:14px;color:var(--sub);cursor:pointer;font-size:15px}
.photo .box{position:relative;display:inline-block}
.photo img{max-width:100%;max-height:220px;border-radius:12px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.photo .rm{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
button:disabled{opacity:.6}
.err{color:var(--out);font-size:13px;min-height:18px;margin-top:-6px;margin-bottom:6px}
html[data-theme="cream"]{--bg:#f6f4ef;--card:#ffffff;--ink:#1f1d1a;--sub:#7a746b;--line:#e8e3da;--chip:#efebe3;--acc:#1f1d1a;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="pink"]{--bg:#fdeef2;--card:#ffffff;--ink:#3a1f28;--sub:#9a6b78;--line:#f5d5de;--chip:#fbe1e8;--acc:#c2456b;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="mint"]{--bg:#e9f6f0;--card:#ffffff;--ink:#16332a;--sub:#5f8577;--line:#cfe8dc;--chip:#dcf0e6;--acc:#1f7a5a;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="sky"]{--bg:#eaf3fc;--card:#ffffff;--ink:#14283d;--sub:#5d7894;--line:#cfe0f2;--chip:#dbe9f7;--acc:#2563a8;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="lav"]{--bg:#f1edfb;--card:#ffffff;--ink:#271d3d;--sub:#7a6e96;--line:#ddd5f2;--chip:#e7e1f8;--acc:#6a4bc4;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="sun"]{--bg:#fdf8e3;--card:#ffffff;--ink:#3a3214;--sub:#8a7d4c;--line:#f0e6b8;--chip:#f7efc9;--acc:#b08a00;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="dark"]{--bg:#171614;--card:#22201d;--ink:#f1ede6;--sub:#9d968b;--line:#34312c;--chip:#2d2a26;--acc:#f1ede6;--out:#ff7b72;--in:#4cc38a;}
html[data-theme="navy"]{--bg:#0f1724;--card:#18233a;--ink:#e8eef8;--sub:#8fa1bf;--line:#26334d;--chip:#202d47;--acc:#7fb2ff;--out:#ff7b72;--in:#4cc38a;}
html[data-theme="dark"],html[data-theme="navy"]{color-scheme:dark}
.fab{color:var(--card)!important}
.save{color:var(--card)!important}
.chips button.on{color:var(--card)!important}
.hdr-r{display:flex;align-items:center;gap:8px}
.themebtn{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.themes{display:none;flex-wrap:wrap;gap:10px;margin:-4px 0 14px}
.themes.on{display:flex}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--ink);font-size:12px;cursor:pointer;padding:0}
.sw i{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw.on i{border-color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我的記帳本</h1>
    <div class="hdr-r"><button class="themebtn" id="themebtn" aria-label="背景顏色">🎨</button>
    <div class="month">
      <button id="prev" aria-label="上個月">‹</button>
      <span id="mlabel"></span>
      <button id="next" aria-label="下個月">›</button>
    </div></div>
  </header>
  <div class="themes" id="themes"></div>

  <div class="card bal">
    <div class="lbl">本月結餘</div>
    <div class="big" id="bal">RM 0.00</div>
    <div class="row2">
      <div><span class="lbl">收入</span><b class="in" id="tin">RM 0.00</b></div>
      <div><span class="lbl">支出</span><b class="out" id="tout">RM 0.00</b></div>
    </div>
  </div>

  <div class="card" id="catcard"><h2>支出分類</h2><div id="cats"></div></div>

  <div class="card"><h2>明細</h2><div id="list"></div></div>
  <div class="card tools">
    <button class="xl" id="xl">📊 下載本月 Excel</button>
    <div class="xlmsg" id="xlmsg"></div>
    <div class="sm">
      <button id="xlall">匯出全部（備份）</button>
      <label>匯入備份<input type="file" id="imp" accept=".xlsx,.xls" hidden></label>
    </div>
  </div>
  <div class="status" id="status">載入中…</div>
</div>

<button class="fab" id="add">＋ 記一筆</button>

<div class="viewer" id="viewer"><img id="vimg" alt="收據"></div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="seg"><button data-t="out" class="on">支出</button><button data-t="in">收入</button></div>
    <div class="amtin"><span>RM</span><input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
    <div class="chips" id="chips"></div>
    <label class="f">備註<input id="note" type="text" maxlength="60" placeholder="例如：午餐 nasi lemak"></label>
    <label class="f">日期<input id="date" type="date"></label>
    <div class="photo">
      <label class="add" id="padd"><span id="ptxt">📷 加收據相</span><input type="file" id="pfile" accept="image/*" hidden></label>
      <div class="box" id="pbox" style="display:none"><img id="pimg" alt="收據"><button class="rm" id="prm">移除</button></div>
    </div>
    <div class="err" id="err"></div>
    <div class="btns">
      <button class="del" id="del" style="display:none">刪除</button>
      <button class="cancel" id="cancel">取消</button>
      <button class="save" id="save">儲存</button>
    </div>
  </div>
</div>

<script>
const CATS={
  out:[["餐飲","🍜"],["交通","🚗"],["購物","🛍️"],["日用","🧴"],["住屋","🏠"],["水電網","💡"],["娛樂","🎮"],["醫療","💊"],["教育","📚"],["其他","📦"]],
  in:[["薪金","💼"],["花紅","🎁"],["副業","🧑‍💻"],["投資","📈"],["其他","💰"]]
};
const icon=(t,c)=>((CATS[t]||[]).find(x=>x[0]===c)||[0,"📦"])[1];
const $=id=>document.getElementById(id);
const fmt=n=>"RM "+n.toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const newId=()=>"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const WD=["日","一","二","三","四","五","六"];
const TYPE_ZH={in:"收入",out:"支出"};

let entries={};
let cur=new Date(); cur.setDate(1);
let form={t:"out",cat:"餐飲",id:null,photo:undefined,pw:0,ph:0};
let formUrl=null;

/* ---------- entries: localStorage ---------- */
const LS="ledger_entries_v1";
let lsOK=true;
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return {}}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(entries))}catch(e){setStatus("⚠️ 儲存空間滿咗，請下載備份")}}

/* ---------- photos: IndexedDB ---------- */
let idb=null; const memPhotos={};
function openIDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open("ledger_photos",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("p");
      r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
    }catch(e){res(null)}
  });
}
function tx(mode,fn){
  return new Promise((res,rej)=>{
    const t=idb.transaction("p",mode), s=t.objectStore("p"), q=fn(s);
    t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}
// store raw bytes, not Blob: iOS Safari loses Blob data kept in IndexedDB ("The object can not be found here")
async function photoPut(id,blob){
  const rec={b:await blob.arrayBuffer(),t:blob.type||"image/jpeg"};
  if(idb)return tx("readwrite",s=>s.put(rec,id));
  memPhotos[id]=rec;
}
async function photoGet(id){
  let v=null;
  try{v=idb?await tx("readonly",s=>s.get(id)):memPhotos[id]}catch(e){return null}
  if(!v)return null;
  try{
    if(v.b)return new Blob([v.b],{type:v.t});
    if(v instanceof Blob){const buf=await v.arrayBuffer();const rec={b:buf,t:v.type||"image/jpeg"};if(idb)tx("readwrite",s=>s.put(rec,id)).catch(()=>{});return new Blob([buf],{type:rec.t})}
  }catch(e){}
  return null; // unreadable (old Safari-damaged photo)
}
const photoDel=id=>idb?tx("readwrite",s=>s.delete(id)).catch(()=>{}):(delete memPhotos[id],Promise.resolve());

function loadImg(blob){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),i=new Image();
    i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),0)};i.onerror=()=>{URL.revokeObjectURL(u);rej()};i.src=u});
}
async function compress(file){
  const img=await loadImg(file), M=1400;
  const k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.78));
  return {blob,w,h};
}

async function init(){
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){lsOK=false}
  entries=lsLoad(); render();
  idb=await openIDB();
  if(!lsOK)setStatus("⚠️ 呢個瀏覽器唔俾儲存，關咗頁面資料會冇咗，請即刻下載 Excel");
  else if(!idb)setStatus("⚠️ 呢個瀏覽器唔俾存相，收據相只會保留到關頁面為止");
  else setStatus("資料只存喺呢部機嘅瀏覽器 · 記得每月下載 Excel 做備份");
}
function setStatus(s){$("status").textContent=s}
function say(s){$("xlmsg").textContent=s;setStatus(s)}

/* ---------- render ---------- */
function render(){
  const ym=cur.getFullYear()+"-"+pad(cur.getMonth()+1);
  $("mlabel").textContent=cur.getFullYear()+"年"+(cur.getMonth()+1)+"月";
  $("xl").textContent="📊 下載 "+(cur.getMonth()+1)+"月 Excel";
  const list=Object.entries(entries).filter(([,e])=>e.date&&e.date.startsWith(ym))
    .sort((a,b)=>b[1].date.localeCompare(a[1].date)||(b[1].ts||0)-(a[1].ts||0));
  let tin=0,tout=0;const bycat={};
  list.forEach(([,e])=>{ if(e.type==="in")tin+=e.amount; else {tout+=e.amount;bycat[e.cat]=(bycat[e.cat]||0)+e.amount} });
  $("tin").textContent=fmt(tin);$("tout").textContent=fmt(tout);
  const b=tin-tout;$("bal").textContent=(b<0?"-":"")+fmt(Math.abs(b));$("bal").className="big "+(b<0?"out":"");

  const cats=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);
  $("catcard").style.display=cats.length?"":"none";
  const max=cats.length?cats[0][1]:1;
  $("cats").innerHTML="";
  cats.forEach(([c,v])=>{
    const r=document.createElement("div");r.className="cat";
    r.innerHTML=`<span></span><div class="bar"><i style="width:${(v/max*100).toFixed(1)}%"></i></div><span class="amt"></span>`;
    r.children[0].textContent=icon("out",c)+" "+c;
    r.children[2].textContent=Math.round(v/tout*100)+"%";
    $("cats").appendChild(r);
  });

  const L=$("list");L.innerHTML="";
  if(!list.length){L.innerHTML='<div class="empty">呢個月仲未有記錄<br>撳下面「記一筆」開始啦</div>';return}
  let lastDay=null;
  const dayTot={};list.forEach(([,e])=>{dayTot[e.date]=(dayTot[e.date]||0)+(e.type==="in"?e.amount:-e.amount)});
  list.forEach(([id,e])=>{
    if(e.date!==lastDay){
      lastDay=e.date;const d=new Date(e.date+"T00:00");
      const h=document.createElement("div");h.className="day";
      const l=document.createElement("span");l.textContent=(d.getMonth()+1)+"月"+d.getDate()+"日 星期"+WD[d.getDay()];
      const r=document.createElement("span");const t=dayTot[e.date];r.textContent=(t<0?"-":"+")+fmt(Math.abs(t));
      h.append(l,r);L.appendChild(h);
    }
    const it=document.createElement("div");it.className="item";
    it.innerHTML=`<div class="ico"></div><div class="t"><div></div><div></div></div><div class="a"></div>`;
    it.querySelector(".ico").textContent=icon(e.type,e.cat);
    it.querySelector(".t div:first-child").textContent=e.cat+(e.photo?" 🧾":"");
    it.querySelector(".t div:last-child").textContent=e.note||" ";
    const a=it.querySelector(".a");a.textContent=(e.type==="in"?"+":"-")+fmt(e.amount);a.classList.add(e.type);
    it.onclick=()=>openForm(id);
    L.appendChild(it);
  });
}

/* ---------- form ---------- */
function drawChips(){
  const c=$("chips");c.innerHTML="";
  CATS[form.t].forEach(([n,i])=>{
    const b=document.createElement("button");b.textContent=i+" "+n;
    if(n===form.cat)b.className="on";
    b.onclick=()=>{form.cat=n;drawChips()};c.appendChild(b);
  });
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===form.t));
}
function showPhoto(blob){
  if(formUrl){URL.revokeObjectURL(formUrl);formUrl=null}
  if(blob){formUrl=URL.createObjectURL(blob);$("pimg").src=formUrl;$("pbox").style.display="";$("padd").style.display="none"}
  else{$("pimg").removeAttribute("src");$("pbox").style.display="none";$("padd").style.display=""}
}
async function openForm(id){
  $("err").textContent="";
  if(id&&entries[id]){
    const e=entries[id];form={t:e.type,cat:e.cat,id,photo:undefined,pw:e.pw||0,ph:e.ph||0};
    $("amt").value=e.amount;$("note").value=e.note||"";$("date").value=e.date;$("del").style.display="";
    showPhoto(null);
    if(e.photo){const b=await photoGet(id);if(form.id===id){showPhoto(b);if(!b)$("err").textContent="呢張收據相讀唔到（舊版問題），請重新加一次"}}
  }else{
    form={t:"out",cat:"餐飲",id:null,photo:undefined,pw:0,ph:0};$("amt").value="";$("note").value="";
    const now=new Date(),same=now.getFullYear()===cur.getFullYear()&&now.getMonth()===cur.getMonth();

$("save").onclick=async()=>{
  const amt=Math.round(parseFloat($("amt").value)*100)/100;

  if(!$("date").value){$("err").textContent="請揀日期";return}

function styleHeader(ws,color){

function canvasPNG(c){return c.toDataURL("image/png").split(",")[1]}

function pieChart(title,data){ // data: [[label,value]]
  const W=640,H=Math.max(360,90+data.length*30),[c,g]=mkCanvas(W,H);
  g.fillStyle="#1f1d1a";g.font=`bold 20px ${FONT}`;g.fillText(title,24,30);
  const tot=data.reduce((s,d)=>s+d[1],0)||1, cx=170, cy=H/2+18, R=125, r=68;
  let a=-Math.PI/2;
  data.forEach((d,i)=>{const s=d[1]/tot*Math.PI*2;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a,a+s);g.closePath();g.fillStyle=PALETTE[i%PALETTE.length];g.fill();a+=s});
  g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fillStyle="#fff";g.fill();
  g.textAlign="center";g.fillStyle="#7a746b";g.font=`13px ${FONT}`;g.fillText("總支出",cx,cy-12);
  g.fillStyle="#1f1d1a";g.font=`bold 17px ${FONT}`;g.fillText(fmt(tot),cx,cy+12);g.textAlign="left";
  const lx=330;let ly=cy-data.length*15+15;

}
function barChart(title,labels,ins,outs){
  const W=640,H=340,[c,g]=mkCanvas(W,H),L=70,Rt=20,T=70,B=44,pw=W-L-Rt,ph=H-T-B;
  g.fillStyle="#1f1d1a";g.font=`bold 20px ${FONT}`;g.fillText(title,24,30);
  [["支出","#D9534F"],["收入","#2E9D6A"]].forEach(([t,col],i)=>{g.fillStyle=col;g.fillRect(W-170+i*80,24,14,14);g.fillStyle="#1f1d1a";g.font=`14px ${FONT}`;g.fillText(t,W-150+i*80,31)});
  const mx=Math.max(1,...ins,...outs), step=Math.pow(10,Math.floor(Math.log10(mx))), top=Math.ceil(mx/step)*step;
  g.font=`12px ${FONT}`;g.textAlign="right";
  for(let i=0;i<=4;i++){const v=top*i/4,y=T+ph-ph*i/4;g.strokeStyle="#eee";g.beginPath();g.moveTo(L,y);g.lineTo(W-Rt,y);g.stroke();g.fillStyle="#7a746b";g.fillText(v>=1000?(v/1000).toFixed(v%1000?1:0)+"k":String(Math.round(v)),L-8,y)}
  const n=labels.length,bw=pw/n,inner=Math.min(bw*0.8,40),each=inner/2;
  g.textAlign="center";
  labels.forEach((lb,i)=>{
    const x0=L+i*bw+(bw-inner)/2;
    const ho=outs[i]/top*ph,hi=ins[i]/top*ph;
    g.fillStyle="#D9534F";g.fillRect(x0,T+ph-ho,each-1,ho);
    g.fillStyle="#2E9D6A";g.fillRect(x0+each,T+ph-hi,each-1,hi);

}

async function buildBook(items,title){

  /* ===== 摘要 ===== */
  const s0=wb.addWorksheet("📊 摘要",{views:[{showGridLines:false}]});

  s0.mergeCells("B1:C1");
  const t=s0.getCell("B1");t.value="📒 "+title;t.font={bold:true,size:16};s0.getRow(1).height=34;
  const kpi=[

    ["💸 總支出",{formula:`SUMIFS(${A},${T},"支出")`,result:tout},MONEY,RED,"FFFBEAEA"],
    ["🏦 結餘",{formula:"C3-C4",result:tin-tout},MONEY,INK,"FFF3F1EC"],
    ["🐷 儲蓄率",{formula:"IF(C3=0,0,C5/C3)",result:tin?(tin-tout)/tin:0},"0.0%",INK,"FFF3F1EC"],
    ["🧾 記錄筆數",{formula:`COUNTA(${T})`,result:n},"0",INK,"FFFFFFFF"],
    ["📅 有支出嘅日數",days,"0",INK,"FFFFFFFF"],
    ["📉 平均每日支出",{formula:"IF(C8=0,0,C4/C8)",result:days?tout/days:0},MONEY,INK,"FFFFFFFF"],
    ["📷 有收據相嘅筆數",items.filter(([,e])=>e.photo).length,"0",INK,"FFFFFFFF"],
  ];
  const border={top:{style:"thin",color:{argb:"FFE8E3DA"}},bottom:{style:"thin",color:{argb:"FFE8E3DA"}}};
  kpi.forEach((k,i)=>{

  s0.getCell("B12").value="💡 圖表係下載嗰陣嘅數字；改「明細」之後上面啲數會自動更新，圖表就唔會。";
  s0.getCell("B12").font={size:10,italic:true,color:{argb:"FF8A847A"}};

  // charts
  const byCat={};items.forEach(([,e])=>{if(e.type==="out")byCat[e.cat]=(byCat[e.cat]||0)+e.amount});

  /* ===== 分類統計 ===== */

  ds.forEach((d,i)=>{

    const to=items.filter(([,e])=>e.date===d&&e.type==="out").reduce((s,[,e])=>s+e.amount,0);
    run+=ti-to;

let pendingFile=null;
async function offer(filename,buf){
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  pendingFile={filename,blob};
  const box=$("xlmsg");box.textContent="";
  const b=document.createElement("button");b.className="xl";b.style.marginTop="4px";b.textContent="📥 儲存 "+filename;
  b.onclick=()=>saveFile(b);box.appendChild(b);
  const t=document.createElement("div");t.textContent="Excel 已準備好，撳上面儲存（可揀「儲存到檔案」）";t.style.marginTop="6px";box.appendChild(t);
}
async function saveFile(btn){
  if(!pendingFile)return;const {filename,blob}=pendingFile;
  const file=new File([blob],filename,{type:blob.type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});$("xlmsg").textContent="已儲存 "+filename+" ✓";pendingFile=null;return}
  }catch(e){if(e&&e.name==="AbortError"){return}}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);
  setTimeout(()=>URL.revokeObjectURL(u),60000);
  $("xlmsg").textContent="已下載 "+filename+" ✓";pendingFile=null;
}

      }
      entries[id]=e;added++;
    }
    lsSave();render();say(`✅ 匯入咗 ${added} 筆新記錄、${photos} 張收據相（重複嘅已略過）`);
  }catch(e){say("❌ 讀唔到呢個檔案，請揀由呢度下載嘅 Excel")}
};

const THEMES=[["cream","🍦 奶油","#f6f4ef","#1f1d1a"],["pink","🌸 粉紅","#fdeef2","#c2456b"],["mint","🌿 薄荷","#e9f6f0","#1f7a5a"],["sky","🌊 天藍","#eaf3fc","#2563a8"],["lav","💜 薰衣草","#f1edfb","#6a4bc4"],["sun","🌼 檸檬","#fdf8e3","#b08a00"],["dark","🌙 深色","#171614","#f1ede6"],["navy","🌌 深藍","#0f1724","#7fb2ff"]];
const AUTO=["auto","📱 跟系統","linear-gradient(135deg,#f6f4ef 50%,#171614 50%)",""];
function applyTheme(t){if(t&&t!=="auto")document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
  try{localStorage.setItem("ledger_theme",t||"auto")}catch(e){}drawThemes()}
function drawThemes(){
  const cur=document.documentElement.dataset.theme||"auto",box=$("themes");box.innerHTML="";
  [AUTO,...THEMES].forEach(([k,n,bg,ac])=>{const b=document.createElement("button");b.className="sw"+(k===cur?" on":"");
    const i=document.createElement("i");i.style.background=ac?`radial-gradient(circle at 70% 70%, ${ac} 0 28%, ${bg} 30%)`:bg;
    const l=document.createElement("span");l.textContent=n;b.append(i,l);b.onclick=()=>applyTheme(k);box.appendChild(b)});
}
$("themebtn").onclick=()=>$("themes").classList.toggle("on");
try{applyTheme(localStorage.getItem("ledger_theme")||"auto")}catch(e){applyTheme("auto")}
init();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
