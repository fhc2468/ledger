<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>記帳本 · Ledger</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1f1d1a;--sub:#7a746b;--line:#e8e3da;
  --out:#d9534f;--in:#2e9d6a;--acc:#1f1d1a;--chip:#efebe3;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171614;--card:#22201d;--ink:#f1ede6;--sub:#9d968b;--line:#34312c;--out:#ff7b72;--in:#4cc38a;--acc:#f1ede6;--chip:#2d2a26}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.month{display:flex;align-items:center;gap:6px}
.month button{border:0;background:var(--chip);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.month span{min-width:92px;text-align:center;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.bal .lbl{color:var(--sub);font-size:13px}
.bal .big{font-size:30px;font-weight:700;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 div{background:var(--chip);border-radius:12px;padding:10px 12px}
.row2 b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}
h2{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.cat{display:grid;grid-template-columns:72px 1fr 82px;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--out);border-radius:6px}
.cat .amt{text-align:right;font-variant-numeric:tabular-nums}
.day{font-size:12px;color:var(--sub);margin:14px 4px 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:18px;flex:none}
.item .t{flex:1;min-width:0}
.item .t div:first-child{font-weight:600}
.item .t div:last-child{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:600;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sub);padding:26px 0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));border:0;background:var(--acc);color:var(--bg);font-size:16px;font-weight:600;padding:14px 30px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}
.mask.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;color:var(--sub);padding:9px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amtin{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);margin-bottom:14px;padding-bottom:6px}
.amtin span{font-size:20px;color:var(--sub);font-weight:600}
.amtin input{border:0;outline:0;background:none;color:var(--ink);font-size:34px;font-weight:700;width:100%;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 11px;border-radius:20px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:12px}
label.f input{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.btns{display:flex;gap:10px;margin-top:6px}
.btns button{flex:1;border:0;padding:13px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.save{background:var(--acc);color:var(--bg)}
.cancel{background:var(--chip);color:var(--ink)}
.del{background:none;color:var(--out);flex:0 0 auto!important;padding:13px 10px!important}
.status{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
.tools .xl{width:100%;border:0;background:var(--in);color:#fff;padding:13px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.xlmsg{font-size:13px;text-align:center;margin-top:8px;min-height:0}
.xlmsg:empty{display:none}
.tools .sm{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:13px}
.tools .sm button,.tools .sm label{border:0;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px}
.photo{margin-bottom:14px}
.photo .add{display:block;text-align:center;border:1.5px dashed var(--line);border-radius:12px;padding:14px;color:var(--sub);cursor:pointer;font-size:15px}
.photo .box{position:relative;display:inline-block}
.photo img{max-width:100%;max-height:220px;border-radius:12px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.photo .rm{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
button:disabled{opacity:.6}
.err{color:var(--out);font-size:13px;min-height:18px;margin-top:-6px;margin-bottom:6px}
html[data-theme="cream"]{--bg:#f6f4ef;--card:#ffffff;--ink:#1f1d1a;--sub:#7a746b;--line:#e8e3da;--chip:#efebe3;--acc:#1f1d1a;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="pink"]{--bg:#fdeef2;--card:#ffffff;--ink:#3a1f28;--sub:#9a6b78;--line:#f5d5de;--chip:#fbe1e8;--acc:#c2456b;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="mint"]{--bg:#e9f6f0;--card:#ffffff;--ink:#16332a;--sub:#5f8577;--line:#cfe8dc;--chip:#dcf0e6;--acc:#1f7a5a;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="sky"]{--bg:#eaf3fc;--card:#ffffff;--ink:#14283d;--sub:#5d7894;--line:#cfe0f2;--chip:#dbe9f7;--acc:#2563a8;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="lav"]{--bg:#f1edfb;--card:#ffffff;--ink:#271d3d;--sub:#7a6e96;--line:#ddd5f2;--chip:#e7e1f8;--acc:#6a4bc4;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="sun"]{--bg:#fdf8e3;--card:#ffffff;--ink:#3a3214;--sub:#8a7d4c;--line:#f0e6b8;--chip:#f7efc9;--acc:#b08a00;--out:#d9534f;--in:#2e9d6a;}
html[data-theme="dark"]{--bg:#171614;--card:#22201d;--ink:#f1ede6;--sub:#9d968b;--line:#34312c;--chip:#2d2a26;--acc:#f1ede6;--out:#ff7b72;--in:#4cc38a;}
html[data-theme="navy"]{--bg:#0f1724;--card:#18233a;--ink:#e8eef8;--sub:#8fa1bf;--line:#26334d;--chip:#202d47;--acc:#7fb2ff;--out:#ff7b72;--in:#4cc38a;}
html[data-theme="dark"],html[data-theme="navy"]{color-scheme:dark}
.fab{color:var(--card)!important}
.save{color:var(--card)!important}
.chips button.on{color:var(--card)!important}
.hdr-r{display:flex;align-items:center;gap:8px}
.themebtn{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.themes{display:none;flex-wrap:wrap;gap:10px;margin:-4px 0 14px}
.themes.on{display:flex}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--ink);font-size:12px;cursor:pointer;padding:0}
.sw i{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw.on i{border-color:var(--acc)}
.langs{display:none;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.langs.on{display:flex}
.langs button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.langs button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
header{flex-wrap:wrap;row-gap:10px}
h1{font-size:20px;white-space:nowrap;margin-right:auto}
.hdr-r{margin-left:auto}
.hdr-r{flex:none}
.month span{min-width:84px;font-size:14px}
.themebtn{flex:none}
#cats{display:grid;grid-template-columns:minmax(0,max-content) minmax(70px,1fr) 44px;gap:10px 10px;align-items:center;font-size:14px}
.cat{display:contents!important}
.cat>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.disc{text-align:center;margin-top:10px}
.disc button{border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.dsheet h2{font-size:18px;color:var(--ink);margin:0 0 6px}
.dsheet h3{font-size:14px;margin:14px 0 4px}
.dsheet p{margin:0;font-size:14px;line-height:1.6;color:var(--ink)}
.dsheet .btns{margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i="title">我的記帳本</h1>
    <div class="hdr-r">
    <button class="themebtn" id="langbtn" data-aria="langBtn" aria-label="語言">🌐</button>
    <button class="themebtn" id="themebtn" data-aria="themeBtn" aria-label="背景顏色">🎨</button>
    <div class="month">
      <button id="prev" data-aria="prev" aria-label="上個月">‹</button>
      <span id="mlabel"></span>
      <button id="next" data-aria="next" aria-label="下個月">›</button>
    </div></div>
  </header>
  <div class="langs" id="langs"></div>
  <div class="themes" id="themes"></div>

  <div class="card bal">
    <div class="lbl" data-i="balance">本月結餘</div>
    <div class="big" id="bal">RM 0.00</div>
    <div class="row2">
      <div><span class="lbl" data-i="income">收入</span><b class="in" id="tin">RM 0.00</b></div>
      <div><span class="lbl" data-i="expense">支出</span><b class="out" id="tout">RM 0.00</b></div>
    </div>
  </div>

  <div class="card" id="catcard"><h2 data-i="catTitle">支出分類</h2><div id="cats"></div></div>

  <div class="card"><h2 data-i="details">明細</h2><div id="list"></div></div>
  <div class="card tools">
    <button class="xl" id="xl">📊 Excel</button>
    <div class="xlmsg" id="xlmsg"></div>
    <div class="sm">
      <button id="xlall" data-i="exportAll">匯出全部（備份）</button>
      <label><span data-i="import">匯入備份</span><input type="file" id="imp" accept=".xlsx,.xls" hidden></label>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="disc"><button id="disclink">ⓘ 免責聲明</button></div>
</div>

<button class="fab" id="add" data-i="add">＋ 記一筆</button>

<div class="mask" id="discm"><div class="sheet dsheet"><h2 id="disct"></h2><div id="discb"></div><div class="btns"><button class="save" id="discx"></button></div></div></div>

<div class="viewer" id="viewer"><img id="vimg" alt=""></div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="seg"><button data-t="out" class="on" data-i="expense">支出</button><button data-t="in" data-i="income">收入</button></div>
    <div class="amtin"><span>RM</span><input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
    <div class="chips" id="chips"></div>
    <label class="f"><span data-i="note">備註</span><input id="note" type="text" maxlength="60" data-ph="notePh"></label>
    <label class="f"><span data-i="date">日期</span><input id="date" type="date"></label>
    <div class="photo">
      <label class="add" id="padd"><span id="ptxt" data-i="addPhoto">📷 加入收據照片</span><input type="file" id="pfile" accept="image/*" hidden></label>
      <div class="box" id="pbox" style="display:none"><img id="pimg" alt=""><button class="rm" id="prm" data-i="remove">移除</button></div>
    </div>
    <div class="err" id="err"></div>
    <div class="btns">
      <button class="del" id="del" style="display:none">刪除</button>
      <button class="cancel" id="cancel" data-i="cancel">取消</button>
      <button class="save" id="save" data-i="save">儲存</button>
    </div>
  </div>
</div>

let idb=null; const memPhotos={};
function openIDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open("ledger_photos",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("p");
      r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
    }catch(e){res(null)}
  });
}
function tx(mode,fn){
  return new Promise((res,rej)=>{
    const t=idb.transaction("p",mode), s=t.objectStore("p"), q=fn(s);
    t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}
// store raw bytes, not Blob: iOS Safari loses Blob data kept in IndexedDB
async function photoPut(id,blob){
  const rec={b:await blob.arrayBuffer(),t:blob.type||"image/jpeg"};
  if(idb)return tx("readwrite",s=>s.put(rec,id));
  memPhotos[id]=rec;
}
async function photoGet(id){
  let v=null;
  try{v=idb?await tx("readonly",s=>s.get(id)):memPhotos[id]}catch(e){return null}
  if(!v)return null;
  try{
    if(v.b)return new Blob([v.b],{type:v.t});
    if(v instanceof Blob){const buf=await v.arrayBuffer();const rec={b:buf,t:v.type||"image/jpeg"};if(idb)tx("readwrite",s=>s.put(rec,id)).catch(()=>{});return new Blob([buf],{type:rec.t})}
  }catch(e){}
  return null;
}
const photoDel=id=>idb?tx("readwrite",s=>s.delete(id)).catch(()=>{}):(delete memPhotos[id],Promise.resolve());

function loadImg(blob){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),i=new Image();
    i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),0)};i.onerror=()=>{URL.revokeObjectURL(u);rej()};i.src=u});
}
async function compress(file){
  const img=await loadImg(file), M=1400;
  const k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.78));
  return {blob,w,h};
}

const XL=(()=>{
  const enc=new TextEncoder();
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
  function zip(files){ // [{name, data:Uint8Array}] stored, no compression
    const parts=[],cd=[];let off=0;
    for(const f of files){
      const nm=enc.encode(f.name),d=f.data,crc=crc32(d);
      const h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
      h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);
      h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer),nm,d);
      const c=new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
      c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);
      c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
      cd.push(new Uint8Array(c.buffer),nm);
      off+=30+nm.length+d.length;
    }
    const cdSize=cd.reduce((s,u)=>s+u.length,0);
    const e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
    e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
    const all=[...parts,...cd,new Uint8Array(e.buffer)],out=new Uint8Array(all.reduce((s,u)=>s+u.length,0));
    let p=0;for(const u of all){out.set(u,p);p+=u.length}return out;
  }
  const esc=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const colName=n=>{let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
  const parseRef=a=>{const m=/^([A-Z]+)(\d+)$/.exec(a);let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return {c,r:+m[2]}};
  const b64u8=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
  const rgb=c=>c&&c.argb?c.argb:null;

  class Cell{constructor(){this.value=null;this.numFmt=null;this.font=null;this.fill=null;this.alignment=null;this.border=null}}
  class Row{
    constructor(ws,r){this.ws=ws;this.r=r;this.cells={};this.height=null;this.alignment=null}
    getCell(i){return this.cells[i]||(this.cells[i]=new Cell())}
    eachCell(o,f){const all=typeof o==="object"&&o.includeEmpty;if(typeof o==="function")f=o;
      const mx=Math.max(this.ws.cols.length,...Object.keys(this.cells).map(Number),0);
      for(let i=1;i<=mx;i++){if(all||(this.cells[i]&&this.cells[i].value!=null))f(this.getCell(i),i)}}
  }
  class Sheet{
    constructor(name,opt){this.name=name;this.rows={};this.cols=[];this.merges=[];this.cf=[];this.imgs=[];this.autoFilter=null;
      this.views=(opt&&opt.views)||[]}
    set columns(cs){this.cols=cs;if(cs.some(c=>c.header)){const r=this.getRow(1);cs.forEach((c,i)=>{if(c.header)r.getCell(i+1).value=c.header})}}

  const TIN=typeName("in"),TOUT=typeName("out");
  let tin=0,tout=0;items.forEach(([,e])=>e.type==="in"?tin+=e.amount:tout+=e.amount);
  const days=new Set(items.filter(([,e])=>e.type==="out").map(([,e])=>e.date)).size;

  /* summary */
  const s0=wb.addWorksheet(s.shSum,{views:[{showGridLines:false}]});
  s0.columns=[{width:4},{width:30},{width:20},{width:4}];
  s0.mergeCells("B1:C1");
  const t=s0.getCell("B1");t.value="📒 "+title;t.font={bold:true,size:16};s0.getRow(1).height=34;
  const vals=[
    [{formula:`SUMIFS(${A},${T},"${TIN}")`,result:tin},MONEY,GREEN,"FFE8F5EE"],
    [{formula:`SUMIFS(${A},${T},"${TOUT}")`,result:tout},MONEY,RED,"FFFBEAEA"],
    [{formula:"C3-C4",result:tin-tout},MONEY,INK,"FFF3F1EC"],
    [{formula:"IF(C3=0,0,C5/C3)",result:tin?(tin-tout)/tin:0},"0.0%",INK,"FFF3F1EC"],
    [{formula:`COUNTA(${T})`,result:n},"0",INK,"FFFFFFFF"],
    [days,"0",INK,"FFFFFFFF"],
    [{formula:"IF(C8=0,0,C4/C8)",result:days?tout/days:0},MONEY,INK,"FFFFFFFF"],
    [items.filter(([,e])=>e.photo).length,"0",INK,"FFFFFFFF"],
  ];
  const border={top:{style:"thin",color:{argb:"FFE8E3DA"}},bottom:{style:"thin",color:{argb:"FFE8E3DA"}}};
  vals.forEach((k,i)=>{
    const row=s0.getRow(i+3);row.height=i<4?28:22;
    const a=row.getCell(2),b=row.getCell(3);
    a.value=s.kpi[i];b.value=k[0];b.numFmt=k[1];
    a.font={size:i<4?13:11,color:{argb:"FF5A554D"}};b.font={bold:true,size:i<4?14:11,color:{argb:k[2]}};
    b.alignment={horizontal:"right",vertical:"middle"};a.alignment={vertical:"middle"};
    a.fill=b.fill=fill(k[3]);a.border=b.border=border;
  });
  s0.addConditionalFormatting({ref:"C5",rules:[
    {type:"expression",formulae:["C5<0"],style:{font:{bold:true,color:{argb:RED}}}},
    {type:"expression",formulae:["C5>0"],style:{font:{bold:true,color:{argb:GREEN}}}}]});
  s0.getCell("B12").value=s.xNote;
  s0.getCell("B12").font={size:10,italic:true,color:{argb:"FF8A847A"}};

  const byCat={};items.forEach(([,e])=>{if(e.type==="out")byCat[e.cat]=(byCat[e.cat]||0)+e.amount});
  let rowAt=13;
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>[catLabel("out",c),v]);
  const place=img=>{
    const id=wb.addImage({base64:img.b,extension:"png"});
    const w=Math.round(img.w*0.8),h=Math.round(img.h*0.8);
    s0.addImage(id,{tl:{col:1,row:rowAt},ext:{width:w,height:h},editAs:"oneCell"});
    rowAt+=Math.ceil(h/20)+1;
  };
  if(cats.length)place(pieChart(s.pie,s.pieCenter,cats));
  const months=[...new Set(items.map(([,e])=>e.date.slice(0,7)))].sort();
  const sumBy=(tp,f)=>items.filter(([,e])=>e.type===tp&&f(e)).reduce((a,[,e])=>a+e.amount,0);
  if(months.length>1){
    place(barChart(s.barMonth,months.map(m=>s.monShort(+m.slice(5))),months.map(m=>sumBy("in",e=>e.date.startsWith(m))),months.map(m=>sumBy("out",e=>e.date.startsWith(m)))));
  }else if(items.length){
    const [y,m]=months[0].split("-").map(Number),dim=new Date(y,m,0).getDate(),lbl=[],ins=[],outs=[];
    for(let d=1;d<=dim;d++){const ds=months[0]+"-"+pad(d);lbl.push(String(d));ins.push(sumBy("in",e=>e.date===ds));outs.push(sumBy("out",e=>e.date===ds))}
    place(barChart(s.barDay,lbl,ins,outs));
  }

  /* categories */
  const s2=wb.addWorksheet(s.shCat);
  const hc=s.hCat;
  s2.columns=[{header:hc[0],width:14},{header:hc[1],width:26},{header:hc[2],width:15},{header:hc[3],width:10},{header:hc[4],width:9},{header:hc[5],width:24}];
  styleHeader(s2);
  ["out","in"].forEach(tp=>{
    const zh=typeName(tp), tot=tp==="in"?tin:tout;
    CATS[tp].forEach(([c])=>{
      const its=items.filter(([,e])=>e.type===tp&&e.cat===c);if(!its.length)return;
      const v=its.reduce((a,[,e])=>a+e.amount,0), r=s2.rowCount+1, lab=catLabel(tp,c), pct=tot?v/tot:0;
      const row=s2.addRow([zh,lab,
        {formula:`SUMIFS(${A},${T},"${qs(zh)}",${C},"${qs(lab)}")`,result:v},
        {formula:`IFERROR(C${r}/SUMIFS(${A},${T},"${qs(zh)}"),0)`,result:pct},
        {formula:`COUNTIFS(${T},"${qs(zh)}",${C},"${qs(lab)}")`,result:its.length},
        {formula:`REPT("█",ROUND(D${r}*20,0))`,result:"█".repeat(Math.round(pct*20))}]);
      const col=tp==="in"?GREEN:RED;
      row.getCell(1).font={bold:true,color:{argb:col}};
      row.getCell(3).numFmt=MONEY;row.getCell(4).numFmt="0%";row.getCell(6).font={color:{argb:col}};
      row.height=20;
    });
  });

  /* daily */
  const s3=wb.addWorksheet(s.shDay);
  const hd=s.hDay;
  s3.columns=[{header:hd[0],width:12},{header:hd[1],width:7},{header:hd[2],width:15},{header:hd[3],width:16},{header:hd[4],width:14},{header:hd[5],width:16},{header:hd[6],width:20}];
  styleHeader(s3);
  const ds=[...new Set(items.map(([,e])=>e.date))].sort(), dl=Math.max(ds.length+1,2); let run=0;
  const maxOut=Math.max(1,...ds.map(d=>sumBy("out",e=>e.date===d)));
  ds.forEach((d,i)=>{
    const r=i+2, ti=sumBy("in",e=>e.date===d), to=sumBy("out",e=>e.date===d), dt=new Date(d+"T00:00");
    run+=ti-to;
    const row=s3.addRow([serial(d),s.wd(dt),
      {formula:`SUMIFS(${A},${T},"${TIN}",${D},A${r})`,result:ti},
      {formula:`SUMIFS(${A},${T},"${TOUT}",${D},A${r})`,result:to},
      {formula:`C${r}-D${r}`,result:ti-to},
      {formula:i?`F${r-1}+E${r}`:`E${r}`,result:run},
      {formula:`REPT("█",ROUND(D${r}/MAX($D$2:$D$${dl})*15,0))`,result:"█".repeat(Math.round(to/maxOut*15))}]);
    row.getCell(1).numFmt=DATE;[3,4,5,6].forEach(c=>row.getCell(c).numFmt=MONEY);
    row.getCell(3).font={color:{argb:GREEN}};row.getCell(4).font={color:{argb:RED}};row.getCell(7).font={color:{argb:RED}};
    const wd=dt.getDay();if(wd===0||wd===6)row.getCell(2).font={bold:true,color:{argb:"FF3E7CB1"}};
  });
  if(ds.length){
    const rules=c=>[{type:"expression",formulae:[`${c}2<0`],style:{font:{color:{argb:RED}}}},{type:"expression",formulae:[`${c}2>0`],style:{font:{color:{argb:GREEN}}}}];
    s3.addConditionalFormatting({ref:`E2:E${dl}`,rules:rules("E")});
    s3.addConditionalFormatting({ref:`F2:F${dl}`,rules:rules("F")});
  }
  s3.views=[{state:"frozen",ySplit:1}];

  /* details with receipt photos */
  const s1=wb.addWorksheet(DET);
  const ht=s.hDet;
  s1.columns=[{header:ht[0],width:12},{header:ht[1],width:13},{header:ht[2],width:24},{header:ht[3],width:26},{header:ht[4],width:14},{header:ht[5],width:22}];
  styleHeader(s1);
  const BOX_W=150, BOX_H=190;
  for(let i=0;i<n;i++){
    const [id,e]=items[i];
    const row=s1.addRow([serial(e.date),typeName(e.type),catLabel(e.type,e.cat),e.note||"",e.amount,e.photo?"":"—"]);
    const col=e.type==="in"?GREEN:RED;
    row.getCell(1).numFmt=DATE;row.getCell(5).numFmt=MONEY;
    row.getCell(2).font={bold:true,color:{argb:col}};row.getCell(5).font={color:{argb:col}};
    row.getCell(6).alignment={horizontal:"center",vertical:"middle",wrapText:true};
    row.alignment={vertical:"middle",wrapText:true};

      if(bytes){
        const imgId=wb.addImage({buffer:bytes,extension:"jpeg"});
        let w=e.pw||BOX_W,h=e.ph||BOX_H;const k=Math.min(BOX_W/w,BOX_H/h);w=Math.round(w*k);h=Math.round(h*k);
        row.height=Math.ceil((BOX_H+8)*0.75);
        s1.addImage(imgId,{tl:{col:5.05,row:i+1.03},ext:{width:w,height:h},editAs:"oneCell"});
      }else row.getCell(6).value=s.photoLost;
    }
  }
  s1.autoFilter={from:"A1",to:`F${Math.max(n+1,1)}`};
  s1.views=[{state:"frozen",ySplit:1}];
  return await wb.xlsx.writeBuffer();
}

/* ---------- save file (iPhone share sheet / download) ---------- */
let pendingFile=null;
async function offer(filename,buf){
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  pendingFile={filename,blob};
  const box=$("xlmsg");box.textContent="";
  const b=document.createElement("button");b.className="xl";b.style.marginTop="4px";b.textContent=L().saveBtn(filename);
  b.onclick=()=>saveFile();box.appendChild(b);
  const t=document.createElement("div");t.textContent=L().ready;t.style.marginTop="6px";box.appendChild(t);
}
async function saveFile(){
  if(!pendingFile)return;const {filename,blob}=pendingFile;
  const file=new File([blob],filename,{type:blob.type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});$("xlmsg").textContent=L().saved(filename);pendingFile=null;return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);
  setTimeout(()=>URL.revokeObjectURL(u),60000);
  $("xlmsg").textContent=L().saved(filename);pendingFile=null;
}
const sortedItems=f=>Object.entries(entries).filter(([,e])=>f(e)).sort((a,b)=>a[1].date.localeCompare(b[1].date)||(a[1].ts||0)-(b[1].ts||0));
async function doExport(btn,items,name,title){
  if(!items.length){say(L().noData);return}
  const label=btn.textContent;btn.disabled=true;btn.textContent=L().buildingBtn;$("xlmsg").textContent=L().building;
  try{await offer(name,await buildBook(items,title))}
  catch(e){say(L().buildErr+(e&&e.message||e))}
  btn.disabled=false;btn.textContent=label;
}
$("xl").onclick=()=>{
  const y=cur.getFullYear(),m=cur.getMonth()+1,ym=y+"-"+pad(m);
  doExport($("xl"),sortedItems(e=>e.date.startsWith(ym)),`${L().file}_${ym}.xlsx`,L().xTitleMonth(y,m));
};
$("xlall").onclick=()=>doExport($("xlall"),sortedItems(()=>true),`${L().fileAll}_${todayStr()}.xlsx`,L().xTitleAll);

/* ---------- import backup (any language, incl. photos) ---------- */
function parseCat(tp,raw){
  const x=String(raw||"").trim();
  for(const [id] of CATS[tp]){const names=(CAT_NAMES[tp][id]||[id]);for(const nm of [id,...names]){if(x===nm||x.endsWith(" "+nm))return id}}
  return x.replace(/^\S+\s+/,"")||"其他";
}
$("imp").onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  say(L().importing);
  try{
    const buf=await f.arrayBuffer();let sh=null;
    for(const nm of [S.zh.shDet,S.en.shDet,S.ms.shDet]){sh=await XL.readSheet(buf,nm);if(sh)break}
    if(!sh)throw 0;
    const have=new Set(Object.values(entries).map(e=>[e.date,e.type,e.cat,e.note||"",e.amount].join("|")));
    let added=0,photos=0;
    for(let r=2;r<sh.rows.length;r++){
      const row=sh.rows[r];if(!row)continue;
      const [d,t,c,note,amtRaw]=row,amt=+amtRaw;
      if(d==null||!t||!(amt>0))continue;
      let ds;
      if(typeof d==="number"){const x=new Date(Date.UTC(1899,11,30)+Math.round(d)*864e5);ds=x.getUTCFullYear()+"-"+pad(x.getUTCMonth()+1)+"-"+pad(x.getUTCDate())}
      else ds=String(d).slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(ds))continue;
      const tp=TYPE_WORDS.in.some(w=>String(t).trim()===w)?"in":"out";
      const e={type:tp,cat:parseCat(tp,c),note:String(note||""),amount:Math.round(amt*100)/100,date:ds,ts:Date.now()+r};
      const key=[e.date,e.type,e.cat,e.note,e.amount].join("|");if(have.has(key))continue;have.add(key);
      const id=newId(),im=sh.images[r];
      if(im){
        try{const blob=new Blob([im.data],{type:"image/"+im.ext});const img=await loadImg(blob);await photoPut(id,blob);
          e.photo=true;e.pw=img.naturalWidth;e.ph=img.naturalHeight;photos++}catch(x){}
      }
      entries[id]=e;added++;
    }
    lsSave();render();say(L().imported(added,photos));
  }catch(e){say(L().importErr)}
};
